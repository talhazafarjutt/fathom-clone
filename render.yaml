# Render blueprint: one web service from the Dockerfile plus a managed Postgres.
# Create it with "New > Blueprint" and point Render at this repository.
services:
  - type: web
    name: cadence
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    # The entrypoint runs `prisma migrate deploy` on boot (RUN_MIGRATIONS=true).
    disk:
      # Only needed while STORAGE_DRIVER=local. Switch to R2 and you can drop it.
      name: uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cadence-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: cadence
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: cadence
          envVarKey: RENDER_EXTERNAL_URL
      - key: LLM_PROVIDER
        value: groq
      - key: TRANSCRIBE_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: STORAGE_DRIVER
        value: local
      - key: GROQ_API_KEY
        sync: false # set this in the Render dashboard
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: cadence-db
    plan: basic-256mb
    postgresMajorVersion: "16"
